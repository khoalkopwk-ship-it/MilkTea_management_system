components:
  securitySchemes:
    accountCookie:
      type: apiKey
      in: cookie
      name: milktea_access_token
      description: JWT account HttpOnly; role/state/version enforced server-side.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tableAccess:
      type: apiKey
      in: header
      name: X-Table-Token
      description: Opaque access scoped to one currently OPEN TableSession, not an account role.
    counterAccess:
      type: apiKey
      in: header
      name: X-Counter-Token
      description: Opaque access scoped to one counter order; client keeps only in current page RAM.
    qrAccess:
      type: apiKey
      in: header
      name: X-QR-Code
      description: Opaque QR code identifies a table; never a staff credential.
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      example: '5'
    Decimal:
      type: string
      pattern: ^[0-9]+(\.[0-9]{1,3})?$
      example: '35000'
    Role:
      type: string
      enum:
      - ADMIN
      - CASHIER
      - KITCHEN
