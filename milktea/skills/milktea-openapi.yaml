openapi: 3.1.0
info:
  title: MilkTea HTTP API — thiết kế một quán
  version: 2.0.0
  description: 'Hợp đồng thiết kế để triển khai; không xác nhận endpoint đã có code. Domain: domain_system.md; HTTP
    envelope: system_architecture.md; security: author_rule.md. Không mô tả STOMP trong OpenAPI. QR read-only; session
    mở khi order/CASHIER open; thanh toán linh hoạt; chỉ CASHIER close. x-allowed-account-roles chỉ ràng buộc nhánh
    xác thực tài khoản, KHÔNG phải điều kiện role cho guest. Guest được cho phép theo nhánh qrAccess/tableAccess/counterAccess
    và phạm vi resource tương ứng; luôn kiểm Domain. Tooling OpenAPI không tự enforce role hay ownership.

    Nguồn: báo cáo MilkTea cập nhật 05/10/2026, 41 UC/T01–T60. Hợp đồng thiết kế; chưa xác nhận các endpoint đã
    được triển khai. v2 bổ sung UC23 thông tin quán, UC30 ngưỡng theo vị trí, UC39 sự cố/tiêu hao pha bù; version
    BIGINT truyền chuỗi; giữ giỏ/context trong kết quả đặt bàn.'
servers:
- url: http://localhost:8080
  description: Ví dụ local; dùng SERVER_PORT và origin thực của project.
