  /api/v1/public/table-context:
    get:
      operationId: readTableContext
      summary: Đọc nhãn bàn và phiên hiện tại, không mở phiên
      description: 'Cho truy cập trang chủ theo QR, không yêu cầu bàn Trống. Nếu có phiên OPEN trả sessionId và
        tableSessionToken hợp lệ; nếu không trả null. Không đổi trạng thái, không tự mở phiên. Response Cache-Control:no-store;
        QR code được che khỏi access log.

        TableContextService là read-only nghiệp vụ; GuestAccessService cấp credential kỹ thuật mới trong transaction
        riêng, không ghi trong transaction readOnly và không đọc raw từ hash. GET không mở phiên/đổi bàn. Có phiên
        thì mỗi lần bootstrap cấp scoped token mới có expiry, no-store và giới hạn cấp; hết phiên revoke.'
      tags:
      - Public
      security: []
