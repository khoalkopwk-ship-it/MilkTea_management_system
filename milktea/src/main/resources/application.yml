spring:
  application:
    name: milktea
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=milktea;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    issuer: milktea
    audience: milktea-web
    secret-base64: ${JWT_SECRET_BASE64:dGhpc0lzQVZlcnlTZWN1cmVCYXNlNjRTZWNyZXRLZXlGb3JNaWxrVGVhQXBwMjAyNg==}
    ttl-minutes: 60
    cookie-secure: false
  websocket:
    allowed-origin: ${WEBSOCKET_ALLOWED_ORIGIN:http://localhost:8080}
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:Password@123}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@milktea.vn}}
    sender-name: MilkTea Cafe
  otp:
    secret: ${OTP_SECRET:default-otp-secret-key-32-bytes-long!}
    expiry-minutes: 10
    cooldown-seconds: 60
    max-attempts: 5