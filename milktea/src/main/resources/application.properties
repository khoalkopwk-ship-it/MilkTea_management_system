spring.application.name=milktea

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# THYMELEAF
spring.thymeleaf.cache=false

# MULTIPART
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SERVER
server.port=${SERVER_PORT:8080}

# APP
app.base-url=${APP_BASE_URL:http://localhost:8080}

# JWT
app.jwt.issuer=milktea
app.jwt.audience=milktea-web
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.ttl-minutes=60
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# WEBSOCKET
app.websocket.allowed-origin=${WS_ALLOWED_ORIGIN:http://localhost:8080}

# CLOUDINARY
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}