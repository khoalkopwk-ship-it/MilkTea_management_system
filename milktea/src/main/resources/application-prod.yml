spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true

server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: framework

app:
  base-url: https://milkteaa.top
  jwt:
    cookie-secure: true
  websocket:
    allowed-origin: https://milkteaa.top

logging:
  file:
    name: logs/milktea-prod.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    vn.edu.ute.milktea: INFO
    org.springframework.security: WARN
    org.hibernate: WARN