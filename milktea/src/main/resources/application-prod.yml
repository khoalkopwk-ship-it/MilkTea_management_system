spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true

app:
  jwt:
    cookie-secure: true

logging:
  file:
    name: logs/milktea-prod.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  level:
    root: INFO
    vn.edu.ute.milktea: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
