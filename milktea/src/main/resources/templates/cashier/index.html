<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: html(~{::content}, ~{::scripts})}">
<head>
    <title>Thu Ngân (POS) - MilkTea</title>
</head>
<body>
    <div th:fragment="content" class="container-fluid py-3 px-lg-4">

<span id="posRole" hidden th:attr="data-role=${actor.role}"></span>
        <!-- Top Header POS -->
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-primary fs-6 py-2 px-3 rounded-pill"><i class="bi bi-calculator me-1"></i> Quầy Thu Ngân</span>
                <span class="text-muted small">Tạo đơn quầy / bàn và quản lý sơ đồ bàn. Xử lý đơn tại “Đơn đã đặt”.</span>
            </div>
            <div>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onclick="CashierApp.init()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Làm mới
                </button>
            </div>
        </div>

        <div class="row g-3">
            <!-- Cột Trái: POS Tạo Đơn Tại Quầy (Counter Order) -->
            <div class="col-lg-4 col-xl-3">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h6 class="fw-bold mb-0"><i class="bi bi-cart-plus me-1 text-primary"></i> Tạo đơn tại quầy / bàn</h6>
                    </div>
                    <div class="card-body p-3 d-flex flex-column">

                        <!-- Danh Sách Món Nhanh (Click để thêm) -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Chọn món thêm vào đơn:</label>
                            <div class="overflow-auto pe-1" style="max-height: 240px;">
                                <div class="d-grid gap-1">
                                    <button th:each="p : ${products}"
                                            type="button" 
                                            class="btn btn-light btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3 border rounded-3"
                                            th:attr="onclick=|CashierApp.addCounterCart({id: ${p.id}, name: '${p.name}', size: '${p.size}', price: ${p.price}})|">
                                        <div>
                                            <strong class="d-block text-truncate" style="max-width: 150px;" th:text="${p.name}">Trà Sữa</strong>
                                            <span class="badge bg-secondary text-white small" th:text="'Size ' + ${p.size}">M</span>
                                        </div>
                                        <span class="text-primary fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA') + ' ₫'}">25.000 ₫</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Giỏ Món Quầy -->
                        <div class="flex-grow-1 border-top pt-2">
                            <label class="form-label small fw-semibold text-muted">Món đã chọn:</label>
                            <div id="counterCartList" class="overflow-auto mb-2" style="max-height: 200px;">
                                <div class="text-center text-muted small py-4">Chưa chọn món nào</div>
                            </div>
                        </div>

                        <!-- Tổng Tiền & Nút Đặt Đơn -->
                        <div class="pt-3 border-top mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-bold">Tổng tiền:</span>
                                <strong class="fs-5 product-price" id="counterCartTotal">0 ₫</strong>
                            </div>
                            <select id="counterTableId" class="form-select mb-2"><option value="">Quầy / mang về</option><option th:each="t : ${tables}" th:value="${t.id}" th:text="${t.name}"></option></select>
                            <select id="counterPayMethod" class="form-select mb-2"><option value="CASH">Tiền mặt</option><option value="BANK_TRANSFER">Chuyển khoản</option></select>
                            <button id="counterSubmitBtn" type="button" class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold" onclick="CashierApp.submitCounterOrder()">
                                <i class="bi bi-check2-circle me-1"></i> Tạo đơn & thanh toán
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột Phải: Sơ Đồ Bàn & Đơn Cần Xử Lý -->
            <div class="col-lg-8 col-xl-9">
                <!-- Nav Tabs -->
                <ul class="nav nav-pills mb-3 gap-2" id="cashierTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tabTables">
                            <i class="bi bi-grid-3x3-gap-fill me-1"></i> Sơ Đồ Bàn
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- Tab 1: Sơ Đồ Bàn -->
                    <div class="tab-pane fade show active" id="tabTables">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="row g-3" id="tablesGrid">
                                <!-- Rendered by cashier.js -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <th:block th:fragment="scripts">
        <script th:src="@{/js/cashier/cashier.js}"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                CashierApp.init();
            });
        </script>
    </th:block>
</body>
</html>
