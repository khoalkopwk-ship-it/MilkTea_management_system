<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: html(~{::content}, ~{::scripts})}"><body>
<div th:fragment="content" class="container-fluid px-lg-4 py-4"><link rel="stylesheet" th:href="@{/css/staff-ui.css}">
<div class="d-flex justify-content-between align-items-center gap-3 mb-3"><div><a th:href="@{/admin}" class="text-muted small text-decoration-none">Quản trị quán</a><h3 class="brand-font mt-2">Kho &amp; Chứng từ</h3></div><button class="btn btn-outline-secondary rounded-pill" onclick="DocumentsApp.load()"><i class="bi bi-arrow-clockwise"></i> Làm mới</button></div>
<div class="nav nav-pills gap-2 mb-4"><a class="nav-link rounded-pill border" th:href="@{/admin/inventory}"><i class="bi bi-box-seam"></i> Tồn kho</a><a class="nav-link active rounded-pill" th:href="@{/admin/documents}"><i class="bi bi-files"></i> Chứng từ</a></div>
<div id="documentError" class="alert alert-danger d-none" role="alert"></div>
<ul class="nav nav-pills documents-tabs gap-2 mb-3" role="tablist">
<li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#docImports" type="button" role="tab">Phiếu nhập kho</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#docMovements" type="button" role="tab">Biến động &amp; hao hụt</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#docCancellations" type="button" role="tab">Phiếu hủy đơn</button></li>

<div class="tab-content documents-panel"><div class="tab-pane fade show active" id="docImports" role="tabpanel"><h5 class="mb-3">Phiếu nhập kho</h5><div id="importDocuments" class="d-grid gap-3"></div></div><div class="tab-pane fade" id="docIssues" role="tabpanel"><h5 class="mb-3">Phiếu chuyển nguyên liệu</h5><div id="issueDocuments" class="d-grid gap-3"></div></div><div class="tab-pane fade" id="docMovements" role="tabpanel"><h5 class="mb-3">Lịch sử biến động kho</h5><select id="movementTypeFilter" class="form-select mb-3" aria-label="Lọc chứng từ biến động"><option value="">Tất cả nghiệp vụ</option><option value="IMPORT">Nhập kho</option><option value="ORDER">Tiêu hao đơn hàng</option><option value="BATCH">Sơ chế</option><option value="WASTE">Hao hụt</option><option value="REMAKE">Pha bù</option></select><div id="movementDocuments"></div></div><div class="tab-pane fade" id="docCancellations" role="tabpanel"><h5 class="mb-3">Phiếu hủy đơn</h5><div id="cancellationDocuments" class="d-grid gap-3"></div></div><div class="tab-pane fade" id="docRefunds" role="tabpanel"><h5 class="mb-3">Yêu cầu hoàn tiền</h5><div id="refundDocuments" class="d-grid gap-3"></div></div></div>
</div><th:block th:fragment="scripts"><script th:src="@{/js/admin/documents.js}"></script></th:block></body></html>
