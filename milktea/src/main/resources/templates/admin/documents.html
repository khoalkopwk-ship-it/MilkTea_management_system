<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: html(~{::content}, ~{::scripts})}">
<head>
    <title>Chứng Từ Kho & Nghiệp Vụ - Admin</title>
</head>
<body>
<div th:fragment="content" class="container-fluid py-4 px-lg-4">
    <link rel="stylesheet" th:href="@{/css/staff-ui.css}">
    
        <style>
            .document-fold {
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                background: #fff;
                overflow: hidden;
                transition: border-color .2s ease;
            }

            .document-fold[open] {
                border-color: #d1d5db;
            }

            .document-fold-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 16px 18px;
                cursor: pointer;
                list-style: none;
            }

            .document-fold-header::-webkit-details-marker {
                display: none;
            }

            .document-fold-header:hover {
                background: #faf9f7;
            }

            .document-fold-title {
                font-size: 15px;
                font-weight: 600;
                margin: 0 0 5px;
            }

            .document-fold-summary {
                font-size: 13px;
                color: #6b7280;
            }

            .document-fold-arrow {
                color: #9ca3af;
                font-size: 18px;
                transition: transform .2s ease;
            }

            .document-fold[open] .document-fold-arrow {
                transform: rotate(180deg);
            }

            .document-fold-body {
                border-top: 1px solid #f0f0f0;
                padding: 16px 18px;
            }

            .document-fold-body p {
                margin-bottom: 10px;
            }

            .document-fold-body p:last-child {
                margin-bottom: 0;
            }

            .document-fold-body .table {
                font-size: 13px;
                margin-bottom: 8px;
            }
        </style>


    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-auto mb-4 admin-sidebar-column">
            <div class="card border-0 shadow-sm rounded-4 p-3 admin-sidebar">
                <h6 class="text-muted small fw-bold px-3 mb-3 text-uppercase">Quản Trị Quán</h6>
                <a th:href="@{/admin/catalog}" class="admin-nav-link">
                    <i class="bi bi-cup-hot-fill"></i> Món & Danh Mục
                </a>
                <a th:href="@{/admin/tables}" class="admin-nav-link">
                    <i class="bi bi-grid-3x3-gap-fill"></i> Sơ Đồ Bàn & QR
                </a>
                <a th:href="@{/admin/staff}" class="admin-nav-link">
                    <i class="bi bi-people-fill"></i> Tài Khoản Nhân Viên
                </a>
                    <a th:href="@{/admin/inventory}" class="admin-nav-link">
                        <i class="bi bi-box-seam-fill"></i> Kho Hàng
                    </a>
                    <a th:href="@{/admin/documents}" class="admin-nav-link active d-flex align-items-center justify-content-between">
                        <span><i class="bi bi-files me-1"></i> Chứng Từ</span>
                        <span class="admin-refund-badge badge rounded-pill bg-danger d-none">0</span>
                    </a>
                <a th:href="@{/admin/reports}" class="admin-nav-link">
                    <i class="bi bi-graph-up-arrow"></i> Báo Cáo Doanh Thu
                </a>
                <a th:href="@{/admin/settings}" class="admin-nav-link">
                    <i class="bi bi-gear-fill"></i> Cài Đặt & Giảm Giá
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col admin-content-column">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="brand-font mb-1">Chứng Từ</h3>
                    <p class="text-muted small mb-0">
                        Tra cứu chứng từ nhập kho, biến động kho, phiếu hủy đơn và phiếu hoàn tiền
                    </p>
                </div>
                <div>
                    <button class="btn btn-outline-secondary rounded-pill" onclick="DocumentsApp.load()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Làm mới
                    </button>
                </div>
            </div>

            <div id="documentError" class="alert alert-danger d-none" role="alert"></div>

            <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-4 col-lg-3">
                        <label for="documentDateFrom" class="form-label small fw-semibold">Từ ngày</label>
                        <input type="date" id="documentDateFrom" class="form-control rounded-3">
                    </div>
                    <div class="col-12 col-md-4 col-lg-3">
                        <label for="documentDateTo" class="form-label small fw-semibold">Đến ngày</label>
                        <input type="date" id="documentDateTo" class="form-control rounded-3">
                    </div>
                    <div class="col-12 col-md-auto">
                        <button type="button" class="btn btn-primary-custom rounded-pill px-3" id="applyDocumentDateFilter">
                            <i class="bi bi-funnel me-1"></i> Lọc
                        </button>
                    </div>
                </div>
            </div>

            <ul class="nav nav-pills documents-tabs gap-2 mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill" data-bs-toggle="pill" data-bs-target="#docImports" type="button" role="tab">
                        Phiếu nhập kho
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#docMovements" type="button" role="tab">
                        Biến động &amp; hao hụt
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#docCancellations" type="button" role="tab">
                        Phiếu hủy đơn
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#docRefunds" type="button" role="tab">
                        Phiếu hoàn <span class="admin-refund-badge badge rounded-pill bg-danger ms-1 d-none">0</span>
                    </button>
                </li>
            </ul>

            <div class="tab-content card border-0 shadow-sm rounded-4 p-4">
                <div class="tab-pane fade show active" id="docImports" role="tabpanel">
                    <h5 class="fw-bold mb-3">Phiếu nhập kho</h5>
                    <div id="importDocuments" class="d-grid gap-3"></div>
                </div>

                <div class="tab-pane fade" id="docMovements" role="tabpanel">
                    <h5 class="fw-bold mb-3">Lịch sử biến động kho</h5>
                    <select id="movementTypeFilter" class="form-select rounded-3 mb-3" aria-label="Lọc chứng từ biến động">
                        <option value="">Tất cả nghiệp vụ</option>
                        <option value="IMPORT">Nhập kho</option>
                        <option value="ORDER">Tiêu hao đơn hàng</option>
                        <option value="BATCH">Sơ chế</option>
                        <option value="WASTE">Hao hụt</option>
                        <option value="REMAKE">Pha bù</option>
                    </select>
                    <div id="movementDocuments"></div>
                </div>

                <div class="tab-pane fade" id="docCancellations" role="tabpanel">
                    <h5 class="fw-bold mb-3">Phiếu hủy đơn</h5>
                    <div id="cancellationDocuments" class="d-grid gap-3"></div>
                </div>

                <div class="tab-pane fade" id="docRefunds" role="tabpanel">
                    <h5 class="fw-bold mb-3">Phiếu hoàn</h5>
                    <div id="refundDocuments" class="d-grid gap-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script th:src="@{/js/admin/documents.js}"></script>
</th:block>
</body>
</html>
