
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="footer" class="milktea-footer py-4 mt-auto">
        <style>
            .milktea-footer {
                --footer-primary: #b86b35;
                --footer-primary-hover: #9e5524;
                --footer-primary-light: #fbeee4;
                --footer-secondary: #775D4A;
                --footer-secondary-hover: #604735;
                --footer-secondary-light: #F3EBE4;
                --footer-cream: #F8F4EF;
                --footer-border: #E8DED5;
                --footer-muted: #786F68;
                background: linear-gradient(110deg, #FFFDFB, #F8F4EF);
                border-top: 1px solid var(--footer-border);
                box-shadow: 0 -3px 16px rgba(96, 71, 53, .035);
                font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            }

            .milktea-footer .footer-brand {
                color: var(--footer-secondary-hover);
                font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0;
                transition: color .2s ease;
            }

            .milktea-footer .footer-brand:hover {
                color: var(--footer-primary);
            }

            .milktea-footer .footer-description {
                color: var(--footer-muted) !important;
                font-size: 12px;
                line-height: 1.6;
            }

            .milktea-footer .footer-address {
                display: inline-flex;
                align-items: center;
                justify-content: flex-end;
                gap: 7px;
                color: var(--footer-muted);
                font-size: 12px;
                line-height: 1.6;
            }

            .milktea-footer .footer-address i {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 29px;
                height: 29px;
                flex-shrink: 0;
                background: var(--footer-primary-light);
                color: var(--footer-primary);
                border: 1px solid #EAD6C4;
                border-radius: 9px;
                font-size: 14px;
                transition:
                    background-color .2s ease,
                    color .2s ease,
                    transform .2s ease;
            }

            .milktea-footer .footer-address:hover i {
                background: var(--footer-primary);
                color: #fff;
                transform: translateY(-2px);
            }

            .milktea-footer .footer-address span {
                color: var(--footer-secondary);
            }

            @media (max-width: 767.98px) {
                .milktea-footer .footer-brand,
                .milktea-footer .footer-description {
                    display: block;
                    margin-left: 0 !important;
                }

                .milktea-footer .footer-brand {
                    margin-bottom: 5px;
                }

                .milktea-footer .footer-address {
                    justify-content: center;
                    margin-top: 5px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .milktea-footer *,
                .milktea-footer *::before,
                .milktea-footer *::after {
                    transition-duration: .01ms !important;
                    animation-duration: .01ms !important;
                }
            }
        </style>

        <div class="container py-2">
            <div class="row g-4 align-items-center">
                <div class="col-12 col-md-4 text-md-start text-center">
                    <span class="brand-font fw-bold footer-brand fs-6"
                          th:text="${settings != null ? settings.shopName : 'MilkTea Quán'}">MilkTea</span>
                    <p class="text-muted small mb-0 mt-1 footer-description" th:text="${activePage == 'home' ? 'Một ly trà yêu thích, một khoảnh khắc dành riêng cho bạn. Khám phá thực đơn và ghé MilkTea hôm nay.' : 'Chuỗi trà sữa đậm vị nguyên bản, phục vụ trực tiếp tại bàn qua QR thông minh và POS quầy.'}">
                        Chuỗi trà sữa đậm vị nguyên bản, phục vụ trực tiếp tại bàn qua QR thông minh và POS quầy.
                    </p>
                </div>

                <div class="col-12 col-md-4 text-center">
                    <div class="d-inline-flex flex-column gap-1 text-muted small">
                        <div class="footer-address justify-content-center" th:if="${activePage != 'home' or (settings != null and !#strings.isEmpty(settings.address))}">
                            <i class="bi bi-geo-alt-fill"></i>
                            <span>Trụ sở chính: </span>
                            <strong th:text="${settings != null and settings.address != null ? settings.address : 'Số 1 Võ Văn Ngân, TP. Thủ Đức'}">
                                Số 1 Võ Văn Ngân, TP. Thủ Đức
                            </strong>
                        </div>
                        <div class="footer-address justify-content-center" th:if="${activePage != 'home'}">
                            <i class="bi bi-telephone-fill"></i>
                            <span>Hotline: </span>
                            <strong>1900 1234</strong>
                            <span class="mx-1">·</span>
                            <i class="bi bi-envelope-fill"></i>
                            <span>Email: </span>
                            <strong>cskh@milktea.top</strong>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4 text-md-end text-center">
                    <div class="d-inline-flex gap-3 text-muted small">
                        <a th:href="@{/(qr=${tableQr})}" class="text-decoration-none text-muted">Trang chủ</a>
                        <span>·</span>
                        <a th:href="@{/menu(branchId=${branchId}, qr=${tableQr})}" class="text-decoration-none text-muted">Thực đơn</a>
                        <span>·</span>
                        <a th:href="@{/#branchesSection}" class="text-decoration-none text-muted">Chi nhánh</a>
                    </div>
                    <div class="text-muted small mt-1" style="font-size: 11px;">
                        <span th:if="${activePage == 'home'}" th:text="${'© ' + #dates.year(#dates.createNow()) + ' ' + (settings != null ? settings.shopName : 'MilkTea')}">© MilkTea</span><span th:unless="${activePage == 'home'}">© 2026 MilkTea Management System. All rights reserved.</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
